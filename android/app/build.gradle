plugins { id 'com.android.application' }
android {
    namespace 'app.aura.pilot'
    compileSdk 35
    defaultConfig {
        applicationId 'app.aura.pilot'
        minSdk 31
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { manifestPlaceholders = [cleartextAllowed:'true'] }
        release { manifestPlaceholders = [cleartextAllowed:'false']; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // 2.2.0 requires compileSdk 37. Keep this SDK-35-compatible release until a tested toolchain upgrade.
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib:2.0.8'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
